<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Build Package — Travelly</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <header class="bg-white shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="./index.html" class="text-blue-600 font-semibold">Travelly</a>
        <nav class="hidden md:flex gap-6 items-center text-slate-700">
          <a href="./index.html" class="hover:text-slate-900">Home</a>
          <a href="./hotels.html" class="hover:text-slate-900">Hotels</a>
          <a href="./cabs.html" class="hover:text-slate-900">Cabs</a>
          <a href="./guides.html" class="hover:text-slate-900">Guides</a>
          <a href="./packages.html" class="hover:text-slate-900">Packages</a>
          <a href="./budget.html" class="hover:text-slate-900">Budget Planner</a>
          <a href="./promotions.html" class="hover:text-slate-900">Offers</a>
        </nav>
        <div class="hidden md:flex gap-3">
          <a href="#" class="px-3 py-1 rounded-md text-sm border border-slate-200">Login</a>
          <a href="#" class="px-3 py-1 rounded-md text-sm bg-blue-600 text-white">Sign up</a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <h1 class="text-2xl font-semibold mb-4">Create a Custom Trip Package</h1>

      <div class="bg-white rounded-lg shadow p-6">
        <!-- Stepper -->
        <div class="flex items-center gap-4 mb-6">
          <div class="step w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center">1</div>
          <div class="flex-1 h-1 bg-slate-200"></div>
          <div class="step w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">2</div>
          <div class="flex-1 h-1 bg-slate-200"></div>
          <div class="step w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">3</div>
          <div class="flex-1 h-1 bg-slate-200"></div>
          <div class="step w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">4</div>
        </div>

        <div id="wizard">
          <section class="wizard-step" data-step="1">
            <h2 class="font-semibold mb-4">Select a hotel</h2>
            <div id="wizardHotels" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </section>

          <section class="wizard-step hidden" data-step="2">
            <h2 class="font-semibold mb-4">Select a cab</h2>
            <div id="wizardCabs" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </section>

          <section class="wizard-step hidden" data-step="3">
            <h2 class="font-semibold mb-4">Select a guide</h2>
            <div id="wizardGuides" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </section>

          <section class="wizard-step hidden" data-step="4">
            <h2 class="font-semibold mb-4">Review & Confirm</h2>
            <div id="summary" class="space-y-3"></div>
          </section>

          <div class="mt-6 flex justify-between">
            <button id="prevStep" class="px-4 py-2 rounded border">Back</button>
            <div>
              <span class="mr-4 text-lg font-semibold">Total: <span id="totalPrice">₹0</span></span>
              <button id="nextStep" class="px-4 py-2 rounded bg-blue-600 text-white">Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-t py-6 mt-8">
      <div class="max-w-6xl mx-auto px-4 text-sm text-slate-600">© 2025 Travelly</div>
    </footer>

    <script src="./assets/scripts.js"></script>
  </body>
</html>
