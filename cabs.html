<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cabs — Travelly</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <header class="bg-white shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="./index.html" class="text-blue-600 font-semibold">Travelly</a>
        <nav class="hidden md:flex gap-6 items-center text-slate-700">
          <a href="./index.html" class="hover:text-slate-900">Home</a>
          <a href="./hotels.html" class="hover:text-slate-900">Hotels</a>
          <a href="./cabs.html" class="hover:text-slate-900">Cabs</a>
          <a href="./guides.html" class="hover:text-slate-900">Guides</a>
          <a href="./packages.html" class="hover:text-slate-900">Packages</a>
          <a href="./budget.html" class="hover:text-slate-900">Budget Planner</a>
          <a href="./promotions.html" class="hover:text-slate-900">Offers</a>
        </nav>
        <div class="hidden md:flex gap-3">
          <a href="#" class="px-3 py-1 rounded-md text-sm border border-slate-200">Login</a>
          <a href="#" class="px-3 py-1 rounded-md text-sm bg-blue-600 text-white">Sign up</a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside class="lg:col-span-1 bg-white p-4 rounded-lg shadow">
          <h3 class="font-semibold mb-3">Filters</h3>
          <label class="block text-sm mb-2">Type</label>
          <select id="cabType" class="w-full p-2 border rounded mb-3">
            <option value="all">All</option>
            <option value="local">Local taxi</option>
            <option value="outstation">Outstation</option>
            <option value="selfdrive">Self-drive</option>
          </select>
          <label class="block text-sm mb-2">Seats</label>
          <select id="cabSeats" class="w-full p-2 border rounded mb-3">
            <option value="any">Any</option>
            <option value="4">4</option>
            <option value="6">6</option>
          </select>
          <label class="block text-sm mb-2">Max price</label>
          <input id="cabMaxPrice" type="number" min="0" placeholder="e.g. 1000" class="w-full p-2 border rounded" />
          <button id="applyCabFilters" class="mt-4 w-full bg-blue-600 text-white p-2 rounded">Apply</button>
        </aside>

        <section class="lg:col-span-3">
          <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold">Cabs</h1>
            <div class="text-sm text-slate-600">Choose from local, outstation & self-drive options</div>
          </div>

          <div id="cabsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cabs injected by JS -->
          </div>
        </section>
      </div>
    </main>

    <footer class="bg-white border-t py-6 mt-8">
      <div class="max-w-6xl mx-auto px-4 text-sm text-slate-600">© 2025 Travelly</div>
    </footer>

    <script src="./assets/scripts.js"></script>
  </body>
</html>
