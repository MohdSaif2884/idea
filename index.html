<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Minimal App</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f6f8fa; }
      .app-container { background:#fff; padding:24px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.08); text-align:center; }
      .title { font-size:20px; margin:0 0 8px; color:#111827; }
      .desc { color:#6b7280; margin:0; }
    </style>
  </head>
  <body>
    <div class="app-container">
      <h1 class="title">App is running</h1>
      <p class="desc">Your minimal Node static server is serving this page.</p>
    </div>
  </body>
</html>
