<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hotels — Travelly</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans">
    <header class="bg-white shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="./index.html" class="text-blue-600 font-semibold">Travelly</a>
        <nav class="hidden md:flex gap-6">
          <a href="./hotels.html">Hotels</a>
          <a href="./cabs.html">Cabs</a>
          <a href="./guides.html">Guides</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
        <h1 class="text-2xl font-semibold">Hotels</h1>
        <div class="flex gap-3">
          <input id="hotelSearch" placeholder="Search by city or hotel" class="p-2 border rounded-md" />
          <select id="sortHotels" class="p-2 border rounded-md">
            <option value="popular">Most popular</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
      </div>

      <section id="hotelsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Hotel cards injected by JS -->
      </section>
    </main>

    <footer class="bg-white border-t py-6 mt-8">
      <div class="max-w-6xl mx-auto px-4 text-sm text-slate-600">© 2025 Travelly</div>
    </footer>

    <script src="./assets/scripts.js"></script>
  </body>
</html>
